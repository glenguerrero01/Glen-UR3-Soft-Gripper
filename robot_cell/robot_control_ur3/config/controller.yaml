# Controladores ros2_control para UR3 + gripper en Gazebo.
# Opcion B: las 6 juntas del gripper se actuan juntas (sin mimic).

controller_manager:
  ros__parameters:
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ur_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

# ==== Brazo UR3 ====
ur_arm_controller:
  ros__parameters:
    joints:
      - ur3_shoulder_pan_joint
      - ur3_shoulder_lift_joint
      - ur3_elbow_joint
      - ur3_wrist_1_joint
      - ur3_wrist_2_joint
      - ur3_wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

# ==== Gripper (6 juntas actuadas: proximal + 2 falanges por dedo) ====
gripper_controller:
  ros__parameters:
    joints:
      - g_left_joint
      - g_left_j23
      - g_left_j34
      - g_right_joint
      - g_right_j23
      - g_right_j34
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    state_publish_rate: 50.0
    action_monitor_rate: 20.0
    constraints:
      goal_time: 5.0
      stopped_velocity_tolerance: 0.01
